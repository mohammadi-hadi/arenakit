[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arenakit"
version = "0.1.0"
description = "Audit a pairwise model leaderboard before you trust its order"
readme = "README.md"
license = "MIT"
authors = [{ name = "Hadi Mohammadi" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "matplotlib>=3.8",
]
keywords = [
    "leaderboard",
    "bradley-terry",
    "pairwise-comparison",
    "llm-evaluation",
    "ranking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/mohammadi-hadi/arenakit"
Issues = "https://github.com/mohammadi-hadi/arenakit/issues"

[project.scripts]
arenakit = "arenakit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arenakit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = false
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
